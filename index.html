<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>apkfreak</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0b0f15;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      color: #eef2f6;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1rem;
      text-align: center;
    }
    .card {
      background: #11171f;
      border-radius: 2rem;
      max-width: 440px;
      width: 100%;
      padding: 3rem 2rem;
      box-shadow: 0 25px 40px -12px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.03);
    }
    h1 {
      font-size: 2rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 2.5rem;
      color: #ffffff;
      text-transform: lowercase;
    }
    h1 span { color: #2b6aff; }
    .app-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .app-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #0e141c;
      border: 1px solid #1e2a36;
      border-radius: 16px;
      padding: 1rem 1.2rem;
      text-decoration: none;
      color: #eef2f6;
      transition: all 0.15s ease;
    }
    .app-item:hover {
      background: #131b25;
      border-color: #2b6aff;
      transform: translateY(-1px);
    }
    .app-name {
      font-size: 1rem;
      font-weight: 500;
      text-transform: lowercase;
    }
    .app-arrow {
      color: #2b6aff;
      font-size: 1.2rem;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1><span>apkfreak</span></h1>

    <div class="app-list">
      <a href="deepseek.html" class="app-item">
        <span class="app-name">deepseek</span>
        <span class="app-arrow">→</span>
      </a>
      <a href="youtube-music.html" class="app-item">
        <span class="app-name">youtube music</span>
        <span class="app-arrow">→</span>
      </a>
    </div>
  </div>
</body>
</html>
